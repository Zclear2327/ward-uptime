name: uptime
# Every 15 minutes: both agent-server addresses must answer /healthz with "ok":true.
# Chris, 2026-11-16: tapped "15-minute uptime check". A failed run emails the repo owner.
# Public on purpose: public repos use no paid Actions minutes, and this holds no secrets
# (both addresses are already public). GitHub can delay scheduled runs by a few minutes, and it pauses
# a schedule in a repo with no activity for 60 days; the keep-alive step commits once a month to prevent that.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check both addresses (one retry after 30 s)
        run: |
          fail=0
          for url in https://agents.wardconsulting.ai/healthz https://ward-agent-server.onrender.com/healthz; do
            ok=""; body=""
            for try in 1 2; do
              body=$(curl -sS --max-time 20 "$url" 2>&1 || true)
              if echo "$body" | grep -q '"ok":true'; then ok=1; break; fi
              [ "$try" = 1 ] && sleep 30
            done
            if [ -n "$ok" ]; then echo "UP   $url"; else echo "::error::DOWN $url answered: ${body:-nothing}"; fail=1; fi
          done
          exit $fail
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - name: monthly keep-alive (stops GitHub pausing the schedule)
        if: github.event_name == 'schedule'
        run: |
          [ "$(date -u +%d%H)" = "0100" ] || exit 0
          [ "$(cat .keepalive 2>/dev/null)" = "$(date -u +%F)" ] && exit 0
          date -u +%F > .keepalive && git add .keepalive
          git -c user.name=uptime -c user.email=uptime@users.noreply.github.com commit -qm "keep-alive" && git push -q
